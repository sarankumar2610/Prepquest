<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepQuest · Analytics</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script src="https://cdn.jsdelivr.net/npm/chart.js" defer></script>
  <script defer src="assets/data.js"></script>
  <script defer src="assets/app.js"></script>
  <style>
    .charts { display:grid; grid-template-columns: repeat(12,1fr); gap:16px; }
    .charts > .card { grid-column: span 6; }
    @media(max-width:920px){ .charts > .card { grid-column: span 12; } }
  </style>
  <script>
    function summarizeAttempts(attempts, tests, questions) {
      const topicStats = new Map();
      const qMap = new Map(questions.map(q => [q.id, q]));
      attempts.forEach(a => {
        a.answers.forEach(ans => {
          const q = qMap.get(ans.questionId); if (!q) return;
          const key = q.topic;
          if (!topicStats.has(key)) topicStats.set(key, { correct:0, total:0, time:0 });
          const s = topicStats.get(key);
          s.total += 1; s.time += ans.timeMs||0; if (ans.chosenIndex === q.correctIndex) s.correct += 1;
        });
      });
      const topics = Array.from(topicStats.keys());
      const mastery = topics.map(t => { const s = topicStats.get(t); return s.total? Math.round(100*s.correct/s.total):0; });
      const avgTime = topics.map(t => { const s = topicStats.get(t); return s.total? Math.round((s.time/s.total)/1000):0; });
      return { topics, mastery, avgTime };
    }
    document.addEventListener('DOMContentLoaded', () => {
      if (!window.PQ) return;
      const attempts = PQ.getAttempts();
      const tests = PQ.getTests();
      const allQIds = tests.flatMap(t => t.questionIds);
      const questions = PQ.getQuestionsByIds(allQIds);
      const { topics, mastery, avgTime } = summarizeAttempts(attempts, tests, questions);
      const user = PQ.getUser('u1') || { xp:0 };
      document.getElementById('overall-acc').textContent = `${attempts[0]?.scorePercent ?? 0}%`;
      document.getElementById('overall-xp').textContent = `${user.xp}`;
      const pct = attempts[0]?.percentile ?? 0; document.getElementById('overall-pctl').textContent = `${pct}th`;
      const mk = (id, cfg) => new Chart(document.getElementById(id), cfg);
      mk('topicRadar', { type:'radar', data:{ labels: topics, datasets:[{ label:'Mastery %', data: mastery, backgroundColor:'rgba(108,140,255,0.2)', borderColor:'#6c8cff'}]}, options:{ scales:{ r:{ angleLines:{ color:'#1f2a4d'}, grid:{ color:'#1f2a4d'}, pointLabels:{ color:'#a0a8c0'} } }, plugins:{ legend:{ labels:{ color:'#e6e8ef' } } } } });
      mk('avgTime', { type:'bar', data:{ labels: topics, datasets:[{ label:'Avg Time (s)', data: avgTime, backgroundColor:'#22d3ee'}]}, options:{ plugins:{ legend:{ labels:{ color:'#e6e8ef' } } }, scales:{ x:{ ticks:{ color:'#e6e8ef' }, grid:{ color:'#1f2a4d' } }, y:{ ticks:{ color:'#e6e8ef' }, grid:{ color:'#1f2a4d' } } } } });
    });
  </script>
</head>
<body>
  <header>
    <nav class="nav" data-nav>
      <div class="brand"><span class="logo"></span> PrepQuest</div>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="tests.html">Tests</a>
        <a href="analytics.html">Analytics</a>
        <a href="contests.html">Contests</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="simulator.html">Interview Simulator</a>
      </div>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <div>
        <h1>Performance Analytics</h1>
        <p class="muted">Live stats based on your attempts.</p>
      </div>
      <div class="row">
        <div class="stat"><div class="label">Overall Accuracy (last)</div><div class="value" id="overall-acc">0%</div></div>
        <div class="stat"><div class="label">Percentile (last)</div><div class="value" id="overall-pctl">0th</div></div>
        <div class="stat"><div class="label">XP</div><div class="value" id="overall-xp">0</div></div>
      </div>
    </section>
    <section class="section charts">
      <div class="card"><div class="card-body"><h3>Topic Mastery</h3><canvas id="topicRadar" height="240"></canvas></div></div>
      <div class="card"><div class="card-body"><h3>Average Time per Topic</h3><canvas id="avgTime" height="240"></canvas></div></div>
    </section>
  </main>
  <footer>© 2025 PrepQuest</footer>
</body>
</html>
