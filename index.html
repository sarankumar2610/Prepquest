<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PrepQuest · Dashboard</title>
  <link rel="stylesheet" href="assets/styles.css">
  <script defer src="assets/data.js"></script>
  <script defer src="assets/app.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const nameEl = document.getElementById('user-name');
      if (nameEl) nameEl.textContent = 'Prince';
      if (!window.PQ) return;
      const tbody = document.getElementById('recent-body');
      if (!tbody) return;
      const attempts = PQ.getAttempts().slice(0, 5);
      tbody.innerHTML = attempts.map(a => {
        const d = new Date(a.startedAt).toISOString().slice(0,10);
        const score = a.scorePercent ?? a.accuracy ?? 0;
        const pill = score >= 75 ? 'good' : 'bad';
        const testName = PQ.getTestById(a.testId)?.name || a.testId;
        return `<tr>
          <td>${testName}</td>
          <td class="muted">${d}</td>
          <td><span class="pill ${pill}">${score}%</span></td>
          <td><a class=\"btn\" href=\"review.html?attemptId=${a.id}\">Review</a></td>
        </tr>`;
      }).join('');
    });
  </script>
</head>
<body>
  <header>
    <nav class="nav" data-nav>
      <div class="brand"><span class="logo"></span> PrepQuest</div>
      <div class="nav-links">
        <a href="index.html">Dashboard</a>
        <a href="tests.html">Tests</a>
        <a href="analytics.html">Analytics</a>
        <a href="contests.html">Contests</a>
        <a href="leaderboard.html">Leaderboard</a>
        <a href="simulator.html">Interview Simulator</a>
      </div>
    </nav>
  </header>
  <main class="container">
    <section class="hero">
      <div>
        <h1>Welcome back, <span id="user-name">Student</span> 👋</h1>
        <p class="muted">Prep Smarter, Quest Further — practice, analyze, and ace placements.</p>
      </div>
      <div class="row">
        <a class="btn primary" href="tests.html">Start Practice</a>
      </div>
    </section>
    <section class="section">
      <h2>Recent Performance</h2>
      <div class="card"><div class="card-body">
        <table>
          <thead><tr><th>Test</th><th>Date</th><th>Score</th><th></th></tr></thead>
          <tbody id="recent-body"></tbody>
        </table>
      </div></div>
    </section>
  </main>
  <footer>© 2025 PrepQuest</footer>
</body>
</html>
